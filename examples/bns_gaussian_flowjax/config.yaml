# Example config for training a BNS neural prior with the flowjax backend,
# with the training setup of arXiv:2511.22987 (Gaussian NS mass model with
# mean 1.33 and standard deviation 0.09, 200 000 samples, Adam with learning
# rate 1e-4, batch size 1024, at most 2000 epochs, patience 250).
#
# The flow is trained on (chirp_mass_source, mass_ratio, lambda_1, lambda_2).
# The saved model can be loaded without torch or scikit-learn with
# neural_priors_gym.flows.flowjax_prior.load_flowjax_prior("outdir/model").
#
# Usage: train_neural_prior config.yaml

output_dir: ./outdir

source_type: bns

masses:
  type: gaussian
  m_min: 1.0
  mean: 1.33
  std: 0.09

lambdas:
  # Point this to your EOS npz file (must contain masses_EOS and Lambdas_EOS)
  eos_path: ../../jester/examples/inference/smc_random_walk/chiEFT/eos_samples.npz

flow:
  backend: flowjax
  flow_type: coupling_nsf
  n_transforms: 4
  nn_width: 256
  nn_depth: 3
  num_bins: 8
  tail_bound: 5.0
  activation: relu
  dtype: float32
  seed: 0

training:
  parameter_names:
    - chirp_mass_source
    - mass_ratio
    - lambda_1
    - lambda_2
  n_samples: 200000
  num_epochs: 2000
  learning_rate: 0.0001
  batch_size: 1024
  max_patience: 250
  validation_split: 0.2
  scale_input: true
